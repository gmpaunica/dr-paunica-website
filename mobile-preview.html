<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobile QA Preview</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#17231f; font-family: system-ui, sans-serif; }
    .wrap { display:grid; gap:14px; justify-items:center; }
    select { width:390px; max-width:calc(100vw - 24px); padding:10px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.2); background:#fffaf1; }
    .phone { width:390px; max-width:calc(100vw - 24px); height:844px; max-height:calc(100vh - 90px); border:14px solid #0f1512; border-radius:42px; overflow:hidden; background:white; box-shadow:0 30px 100px rgba(0,0,0,.45); }
    iframe { width:100%; height:100%; border:0; display:block; }
  </style>
</head>
<body>
  <div class="wrap">
    <select id="page" aria-label="Choose page for mobile preview">
      <option value="index.html">Home</option>
      <option value="approach.html">Approach</option>
      <option value="conditions.html">Conditions</option>
      <option value="appointments.html">Appointments</option>
      <option value="services.html">Services</option>
      <option value="resources.html">Patient guide</option>
      <option value="about.html">About</option>
      <option value="contact.html">Contact</option>
    </select>
    <div class="phone"><iframe id="frame" src="index.html?mobile-qa=1" title="Mobile preview"></iframe></div>
  </div>
  <script>
    const select = document.getElementById('page');
    const frame = document.getElementById('frame');
    select.addEventListener('change', () => { frame.src = select.value + '?mobile-qa=1'; });
  </script>
</body>
</html>
